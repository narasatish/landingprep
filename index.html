  <!-- ═══ Resilience net (registered FIRST so it catches everything) ═══ -->
  <script>
  (function () {
    // Capture global errors so a single uncaught error can't silently white-screen the app.
    window.__lpErrors = [];
    function note(m) { try { window.__lpErrors.push(String(m).slice(0, 300)); if (window.gtag) window.gtag('event', 'exception', { description: String(m).slice(0, 150), fatal: false }); } catch (e) {} }
    // Report real errors to the backend so the team/agent is alerted the instant a page or
    // tool breaks for a visitor. Throttled (<=15/session) + deduped so it never floods.
    var _seen = {}, _sent = 0;
    function report(message, stack, kind) {
      try {
        if (_sent >= 15) return; var k = String(message || '').slice(0, 120); if (!k || _seen[k]) return; _seen[k] = 1; _sent++;
        var base = (window.LP_API_BASE || '');
        var body = JSON.stringify({ message: String(message || '').slice(0, 500), stack: String(stack || '').slice(0, 1500), url: location.href, kind: kind || 'error' });
        if (navigator.sendBeacon) navigator.sendBeacon(base + '/api/clienterror', new Blob([body], { type: 'application/json' }));
        else fetch(base + '/api/clienterror', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function () {});
      } catch (e) {}
    }
    window.__lpReport = report; // the React error boundary calls this too
    window.addEventListener('error', function (e) { var m = (e && e.message) || 'error'; note(m); report(m, e && e.error && e.error.stack, 'window.error'); }, true);
    window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; var m = (r && (r.message || r)) || 'rejection'; note(m); report(m, r && r.stack, 'unhandledrejection'); });
    // Boot watchdog: if React hasn't mounted anything into #root within 12s (CDN down,
    // parse error, etc.), replace the blank screen with a friendly recovery card.
    window.addEventListener('load', function () {
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.childNodes.length > 0) return; // app mounted — all good
        report('App failed to mount within 12s (blank screen shown)', (window.__lpErrors || []).join(' | '), 'boot-timeout');
        root.innerHTML = '<div style="max-width:460px;margin:18vh auto;padding:28px;text-align:center;font-family:system-ui,Arial,sans-serif;color:#1f2937">'
          + '<div style="font-size:42px">📶</div>'
          + '<h1 style="font-size:22px;margin:12px 0 6px">Having trouble loading</h1>'
          + '<p style="color:#6b7280;font-size:15px;line-height:1.6;margin:0 0 18px">This is usually a slow or dropped connection. Your progress is safe.</p>'
          + '<button onclick="location.reload()" style="background:#4F46E5;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer">Reload</button>'
          + '</div>';
      }, 12000);
    });
  })();
  </script>

  <!-- On-demand script loader for lazy-loaded route bundles (keeps heavy data off the
       initial load). Auto-syncs the ?v cache version from the existing script tags so it
       never goes stale. Returns a Promise; de-dupes repeat loads of the same src. -->
  <script>
  window.LP_loadScript = function (src) {
    return new Promise(function (resolve, reject) {
      try {
        var ex = document.querySelector('script[data-lp-lazy="' + src + '"]');
        if (ex) {
          if (ex.getAttribute('data-loaded')) return resolve();
          ex.addEventListener('load', function () { resolve(); });
          ex.addEventListener('error', reject);
          return;
        }
        var v = '';
        try { var s0 = document.querySelector('script[src*="?v="]'); var m = s0 && s0.src.match(/[?&]v=([\w.]+)/); v = m ? m[1] : ''; } catch (e) {}
        var sc = document.createElement('script');
        sc.src = src + (v ? ('?v=' + v) : '');
        sc.async = true;
        sc.setAttribute('data-lp-lazy', src);
        sc.onload = function () { sc.setAttribute('data-loaded', '1'); resolve(); };
        sc.onerror = reject;
        document.head.appendChild(sc);
      } catch (e) { reject(e); }
    });
  };
  </script>
