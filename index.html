    "mainEntity": [
      {"@type":"Question","name":"Are the IELTS, TOEFL and PTE mock tests really free?","acceptedAnswer":{"@type":"Answer","text":"Yes, 100% free forever. All 1,000+ mock tests across IELTS, TOEFL iBT, PTE Academic, CELPIP, Duolingo English Test, GRE and GMAT Focus are free with no signup, no credit card and no paywall. Start any test directly from the homepage."}},
      {"@type":"Question","name":"Do the mock tests use real exam patterns and timings?","acceptedAnswer":{"@type":"Answer","text":"Every test mirrors the official 2026 format and timing - IELTS Listening 30+10 minutes, Reading 60, Writing 60; PTE Read Aloud, Repeat Sentence, Describe Image and Write Essay; GMAT Focus Quant, Verbal and Data Insights. We rebuild the formats and timing, never the copyrighted questions."}},
      {"@type":"Question","name":"Can I practise IELTS and PTE speaking with a real voice?","acceptedAnswer":{"@type":"Answer","text":"Yes. Our AI Speaking Agent uses natural neural voices - you speak into your mic, get live transcripts and AI follow-up questions, just like a real examiner. Listening sections and Describe Image and Re-tell Lecture tasks also play real audio."}},
      {"@type":"Question","name":"Do I get model answers and band-level feedback for writing?","acceptedAnswer":{"@type":"Answer","text":"Every writing task - IELTS Task 1 and 2, TOEFL integrated and discussion, PTE essay, GRE issue, GMAT and CELPIP - includes a free Band 7+/CEFR C1 model answer plus live word-count and rubric guidance. The AI Writing Agent gives instant structured feedback on any essay you paste."}},
      {"@type":"Question","name":"Can LandingPrep also help me choose a university and apply abroad?","acceptedAnswer":{"@type":"Answer","text":"Yes. Beyond free mock tests, LandingPrep includes a free College Predictor across 99 top universities (USA, UK, Canada, Australia, Germany and more) with fees, requirements, scholarships and admission process, plus an SOP builder, study-abroad destination guides with visa-success rates and immigration pathways, and an education-loan comparison - everything to go from test prep to admission, free."}},
      {"@type":"Question","name":"How accurate is the scoring?","acceptedAnswer":{"@type":"Answer","text":"Listening and Reading use the official band and scaled-score conversion tables. Writing and Speaking use a transparent rubric-based heuristic covering task achievement, coherence, vocabulary and grammar. Scores are indicative - an empty answer never scores and random text never reaches Band 8."}},
      {"@type":"Question","name":"Do I need to create an account or download anything?","acceptedAnswer":{"@type":"Answer","text":"No. LandingPrep runs entirely in your browser on any device with no download and no signup. An optional free account only adds progress tracking, streaks and skill analytics across all seven exams."}},
      {"@type":"Question","name":"Which country is best for international students?","acceptedAnswer":{"@type":"Answer","text":"It depends on your budget, field and PR goals. The USA leads on research and salaries; Canada and Australia offer the clearest permanent-residence pathways; the UK has a fast 1-year master's; Germany has near-free public-university tuition; Ireland and the Netherlands are strong English-taught EU hubs. LandingPrep's free Country Guide compares visa-success rates, costs and immigration routes side by side."}},
      {"@type":"Question","name":"How do I shortlist the right universities to study abroad?","acceptedAnswer":{"@type":"Answer","text":"Build a balanced list of Safe, Target and Reach universities based on your test score, GPA and budget. LandingPrep's free Profile Evaluation and College Predictor do this automatically across 99 top universities, showing fees, requirements, acceptance rates and Safe/Target/Reach matches."}},
      {"@type":"Question","name":"Which English test should I take to study abroad?","acceptedAnswer":{"@type":"Answer","text":"Check what your target universities and visa accept. IELTS and TOEFL are the most widely accepted; PTE and the Duolingo English Test are faster and often cheaper; CELPIP is used for Canada. Each LandingPrep exam hub shows the latest pattern, fees and score requirements, all with free mock tests."}},
      {"@type":"Question","name":"How can I fund my study abroad?","acceptedAnswer":{"@type":"Answer","text":"Combine scholarships, education loans and part-time work. LandingPrep's country-based Scholarship Finder lists fully-funded and merit awards, and the Loan Compare tool shows 10 lenders with interest rates, limits and EMI. Most student visas also allow around 20 hours of part-time work per week."}},
      {"@type":"Question","name":"Can I stay and work abroad after I graduate?","acceptedAnswer":{"@type":"Answer","text":"Yes in most top destinations: the USA offers OPT for 12-36 months, the UK a 2-year Graduate Route, Canada a PGWP of up to 3 years, and Australia a 485 visa for 2-4 years. Each LandingPrep Country Guide shows the full step-by-step path from study to work to permanent residence."}},
      {"@type":"Question","name":"What is the student-visa success rate and how do I improve mine?","acceptedAnswer":{"@type":"Answer","text":"Success rates vary by country and profile, and each destination guide shows its indicative visa-success rate. The biggest factors are solid proof of funds, a genuine and consistent study plan, and documents that match. Apply early, especially for the Fall intake."}}

            var nw = reg.installing;

              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                try { nw.postMessage('skipWaiting'); } catch (e) {}

          window.location.reload();
