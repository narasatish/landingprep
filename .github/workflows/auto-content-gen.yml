name: Auto-Draft Blog Content

# Drafts posts for real Google-Autocomplete search gaps with Gemini and tops up
# blog-queue.json. Drafts are written with "reviewed": false and publish-next-post.mjs
# refuses to publish anything unreviewed, so a human must verify the facts and flip the
# flag before a post can go live. Needs a GEMINI_API_KEY repo secret (no key → no-op).
#
# MANUAL ONLY — the weekly cron is deliberately removed. Unattended LLM drafting fed a
# daily auto-publisher, which is the scaled-content pattern the March-2026 core update
# penalises at the domain level, on visa/fee content where a fabricated figure misleads a
# real applicant. Run it from the Actions tab when you actually want drafts to review.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Auto-draft posts for content gaps (only if queue is low)
        run: node scripts/auto-draft-posts.mjs 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit queue if it grew
        run: |
          if git diff --quiet -- blog-queue.json; then
            echo "No new drafts (queue healthy, no gaps, or no GEMINI_API_KEY secret)."
            exit 0
          fi
          git config user.name "landingprep-bot"
          git config user.email "bot@users.noreply.github.com"
          git add blog-queue.json
          git commit -m "Auto-draft: top up blog queue with gap-targeting posts [skip ci]"
          git push
