name: Keep Render Awake

# Render's free tier sleeps after 15 min idle, causing a 30-50s cold start for
# the first visitor. This pings the health endpoint every ~10 minutes so the
# service stays warm and pages load fast. (One always-on free service fits in
# Render's monthly free hours.)
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -fsS --max-time 70 "https://landingprep.com/api/health" || \
          curl -fsS --max-time 70 "https://landingprep-api.onrender.com/api/health" || \
          echo "ping failed (will retry next run)"
