name: Daily Auto-Blog

# Publishes ONE post from blog-queue.json per day: publish-next-post.mjs moves it into
# blog-data.jsx → npm run build prerenders its /blog page + sitemap + RSS → commit & push
# (Render auto-deploys) → IndexNow pings search engines. No live AI call in CI here.
#
# A post publishes ONLY if it carries "reviewed": true. Queue entries created by
# auto-content-gen.yml are Gemini drafts marked "reviewed": false, so they sit in the queue
# until a human verifies the facts. If the head of the queue is unreviewed, this job is a
# no-op for the day. Never remove that gate: it is the only thing standing between an
# LLM draft about visa rules and a live, IndexNow-submitted page.

on:
  schedule:
    - cron: "30 4 * * *"   # daily 04:30 UTC (~10:00 IST)
  workflow_dispatch: {}     # publish one on demand from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci || npm install
      - name: Publish next queued post
        run: node scripts/publish-next-post.mjs
      - name: Build (regenerate pages, sitemap, RSS, compiled blog bundle)
        run: npm run build
      - name: Commit & push if a post was published
        run: |
          if git diff --quiet -- blog-data.jsx; then
            echo "Queue empty or no change — nothing to deploy today."
            exit 0
          fi
          git config user.name "landingprep-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Auto-blog: publish next queued post [skip ci]"
          git push
      - name: Ping IndexNow for the new URLs
        run: node scripts/indexnow-submit.mjs || echo "IndexNow ping skipped (non-fatal)"
