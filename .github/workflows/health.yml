name: Production health check

# External uptime + content check of the LIVE site every 15 minutes. If anything is
# down, returns a 500, or a key page/tool/content stops serving, this job fails and
# GitHub emails the repo owner. Complements the in-app monitor (which also emails you).
# On failure, also opens a "health-alert" issue so the Claude Code health doctor can
# detect outages via mcp__github__actions_list or by listing open "health-alert" issues.
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC)
  workflow_dispatch: {}       # allow manual run from the Actions tab

permissions:
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Synthetic health check
        id: check
        run: node tools/health-monitor.mjs
        continue-on-error: true
        env:
          BASE: ${{ vars.HEALTH_BASE_URL || 'https://landingprep.com' }}

      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "## ✅ All health checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Health check FAILED" >> $GITHUB_STEP_SUMMARY
            echo "See step output above for which endpoints are down." >> $GITHUB_STEP_SUMMARY
          fi
          echo "_Run triggered: $(date -u)_" >> $GITHUB_STEP_SUMMARY

      - name: Open alert issue on failure
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'health-alert',
              state: 'open',
            });
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'HEALTH-ALERT: Production site checks failing',
                body: [
                  '> **Auto-generated by the health.yml workflow — do not close manually.**',
                  '',
                  'One or more synthetic health checks against https://landingprep.com have failed.',
                  '',
                  `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'This issue will be closed automatically when all checks pass again.',
                ].join('\n'),
                labels: ['health-alert'],
              });
            }

      - name: Close alert issue on recovery
        if: steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'health-alert',
              state: 'open',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ All health checks passing again as of ${new Date().toUTCString()}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail the workflow if health check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
