name: Daily Instagram posts

# Self-healing daily poster. Every scheduled run hits ?catchup=1, which posts any of
# TODAY's due-but-unposted slots and records them in a Firestore log — so a skipped or
# late GitHub cron is automatically recovered by the next window, and nothing double-posts.
# Slots are due (UTC): 02:30, 07:00, 10:30, 14:00, 16:00 · weekly carousel Sun 06:00.
on:
  schedule:
    - cron: "0 3 * * *"     # slot 0  (~08:30 IST)
    - cron: "30 6 * * 0"    # Sunday weekly carousel
    - cron: "30 8 * * *"    # slot 1  (~14:00 IST)
    - cron: "0 11 * * *"    # slot 2  (~16:30 IST)
    - cron: "0 13 * * *"    # safety catch-up
    - cron: "30 14 * * *"   # slot 3  (~20:00 IST)
    - cron: "30 16 * * *"   # slot 4  (~22:00 IST)
    - cron: "0 19 * * *"    # FINAL safety net — posts anything still missed today
  workflow_dispatch:
    inputs:
      mode:
        description: "catchup = post today's still-unposted slots (safe, default) · all = force all 5 · cities = weekly carousel · pool = ready-made"
        default: "catchup"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Warm up the server (Render free tier can cold-start)
        run: |
          for i in 1 2 3; do
            curl -s -m 90 "https://landingprep.com/api/health" >/dev/null && break
            sleep 15
          done
          sleep 10

      - name: Publish today's post(s) to Instagram
        run: |
          set -e
          # Scheduled runs use the self-healing catch-up; manual runs keep explicit modes.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.mode }}" = "catchup" ]; then
            QS="catchup=1"
          elif [ "${{ github.event.inputs.mode }}" = "cities" ]; then
            QS="cities=1&manual=1"
          elif [ "${{ github.event.inputs.mode }}" = "pool" ]; then
            QS="pool=next&manual=1"
          elif [ "${{ github.event.inputs.mode }}" = "all" ]; then
            QS="all=1&manual=1"
          elif [ "${{ github.event.inputs.mode }}" = "carousel" ]; then
            QS="carousel=1&manual=1"
          else
            QS="catchup=1"
          fi
          echo "Mode: $QS"
          ok=0
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -m 300 \
              -X POST "https://landingprep.com/api/ig/post-daily?$QS" \
              -H "x-ig-secret: ${{ secrets.IG_POST_SECRET }}")
            echo "Attempt $attempt - HTTP $code"; cat /tmp/resp.json || true; echo
            if [ "$code" = "200" ]; then ok=1; break; fi
            # 202 = accepted; the catch-up posts in the BACKGROUND (instant response so external
            # cron pingers never time out). The Firestore log + in-server scheduler guarantee the
            # posts complete, and any real failure emails an alert — so 202 is success for the trigger.
            if [ "$code" = "202" ]; then ok=1; echo "Accepted (202) - posting in background; completion guaranteed by the Firestore log + scheduler."; break; fi
            if [ "$code" = "207" ]; then
              ok=1
              echo "::warning::Some slots failed this run; the next catch-up window will retry them."
              if grep -qiE 'OAuthException|Invalid OAuth|"code":(190|200|10|803|368)|access token|permission' /tmp/resp.json 2>/dev/null; then
                echo "::error::A Meta auth/permission error - fix the token/app in Meta; catch-up posts it automatically once fixed."
              fi
              break
            fi
            # non-2xx (cold start / gateway / timeout) - retry; but fail fast on a clear auth block
            if grep -qiE 'OAuthException|API access blocked|"code":(190|200|10|803|368)|access token|permission' /tmp/resp.json 2>/dev/null; then
              echo "::error::Instagram blocked the request (auth/permission). Fix the token/app in Meta - catch-up self-heals once fixed."
              exit 1
            fi
            sleep 25
          done
          [ "$ok" = "1" ] || { echo "::error::post endpoint failed after retries"; exit 1; }
