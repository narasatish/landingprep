name: Daily Instagram posts

# Posts 8 on-brand posts/day to the linked Instagram Business account, spaced through the day.
# Each run maps the current UTC hour to a "slot" (0..7) = a different content theme:
#   0 visa/immigration news · 1 daily quiz · 2 country/college spotlight · 3 study-abroad news ·
#   4 word of the day · 5 CAROUSEL (rotates: country guide / top colleges / roadmap / exam) ·
#   6 exam guide · 7 tip / spotlight
# Times are UTC. 02:30 UTC = 08:00 IST. Edit the cron lines or hit "Run workflow" any time.
on:
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST → slot 0 (visa/immigration news)
    - cron: "0 4 * * *"     # 09:30 IST → slot 1 (daily quiz)
    - cron: "30 5 * * *"    # 11:00 IST → slot 2 (country/college spotlight)
    - cron: "0 7 * * *"     # 12:30 IST → slot 3 (study-abroad news)
    - cron: "30 8 * * *"    # 14:00 IST → slot 4 (word of the day)
    - cron: "0 10 * * *"    # 15:30 IST → slot 5 (CAROUSEL)
    - cron: "0 12 * * *"    # 17:30 IST → slot 6 (exam guide)
    - cron: "0 14 * * *"    # 19:30 IST → slot 7 (tip / spotlight)
  workflow_dispatch:
    inputs:
      mode:
        description: "all = post all 8 now · carousel = post today's carousel · single = current slot"
        default: "single"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Warm up the server (Render free tier can cold-start)
        run: |
          for i in 1 2 3; do
            curl -s -m 90 "https://landingprep.com/api/health" >/dev/null && break
            sleep 15
          done
          sleep 10

      - name: Publish today's post(s) to Instagram
        run: |
          set -e
          H=$(date -u +%H)
          case "$H" in
            02|03) slot=0 ;;
            04) slot=1 ;;
            05|06) slot=2 ;;
            07) slot=3 ;;
            08|09) slot=4 ;;
            10|11) slot=5 ;;
            12|13) slot=6 ;;
            14|15) slot=7 ;;
            *) slot=0 ;;
          esac
          # Manual "Run workflow": mode=all posts all 8; mode=carousel posts today's carousel.
          if [ "${{ github.event.inputs.mode }}" = "all" ]; then
            QS="all=1"
          elif [ "${{ github.event.inputs.mode }}" = "carousel" ] || [ "$slot" = "5" ]; then
            QS="carousel=1"
          else
            QS="slot=$slot"
          fi
          echo "UTC hour $H → $QS"
          ok=0
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -m 300 \
              -X POST "https://landingprep.com/api/ig/post-daily?$QS" \
              -H "x-ig-secret: ${{ secrets.IG_POST_SECRET }}")
            echo "Attempt $attempt — HTTP $code"; cat /tmp/resp.json || true; echo
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 25
          done
          [ "$ok" = "1" ] || { echo "::error::Instagram post failed after retries"; exit 1; }
