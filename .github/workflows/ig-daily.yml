name: Daily Instagram posts

# Posts 10 on-brand posts/day to the linked Instagram Business account, spaced through the day.
# Each run maps the current UTC hour to a "slot" (0..7) = a different content theme:
#   0 visa/immigration news · 1 daily quiz · 2 country/college spotlight · 3 study-abroad news ·
#   4 word of the day · 5 CAROUSEL (rotates: country guide / top colleges / roadmap / exam) ·
#   6 exam guide · 7 tip / spotlight
# Times are UTC. 02:30 UTC = 08:00 IST. Edit the cron lines or hit "Run workflow" any time.
on:
  # 10 posts/day for a GLOBAL study-abroad audience (India-weighted, catching US/UK evenings).
  # Peak windows: India 8-10pm IST · UK/EU 7-9pm · US 7-9pm local. Tue–Thu perform best.
  # SCHEDULE PAUSED while Instagram API publishing is blocked (Meta error code 200) and until we
  # settle on a gentler cadence. Manual runs via "Run workflow" (workflow_dispatch) still work.
  # To re-enable automated posting, uncomment the schedule block below.
  # schedule:
  #   - cron: "30 2 * * *"    # 08:00 IST → slot 0
  #   - cron: "0 4 * * *"     # 09:30 IST → slot 1
  #   - cron: "30 5 * * *"    # 11:00 IST → slot 8
  #   - cron: "0 7 * * *"     # 12:30 IST → slot 2
  #   - cron: "30 8 * * *"    # 14:00 IST → slot 9
  #   - cron: "30 12 * * *"   # 18:00 IST → slot 3
  #   - cron: "0 14 * * *"    # 19:30 IST → slot 4
  #   - cron: "0 15 * * *"    # 20:30 IST → slot 5 (carousel)
  #   - cron: "0 16 * * *"    # 21:30 IST → slot 6
  #   - cron: "30 17 * * *"   # 23:00 IST → slot 7
  workflow_dispatch:
    inputs:
      mode:
        description: "pool = post next ready-made Canva post · all = post all 10 · carousel = today's carousel · single = current slot"
        default: "single"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Warm up the server (Render free tier can cold-start)
        run: |
          for i in 1 2 3; do
            curl -s -m 90 "https://landingprep.com/api/health" >/dev/null && break
            sleep 15
          done
          sleep 10

      - name: Publish today's post(s) to Instagram
        run: |
          set -e
          H=$(date -u +%H)
          case "$H" in
            02|03) slot=0 ;;
            04) slot=1 ;;
            05|06) slot=8 ;;
            07) slot=2 ;;
            08|09|10|11) slot=9 ;;
            12|13) slot=3 ;;
            14) slot=4 ;;
            15) slot=5 ;;
            16) slot=6 ;;
            17|18) slot=7 ;;
            *) slot=0 ;;
          esac
          # Manual "Run workflow": mode=pool posts the next ready-made Canva post;
          # mode=all posts all 10; mode=carousel posts today's carousel.
          if [ "${{ github.event.inputs.mode }}" = "pool" ]; then
            QS="pool=next"
          elif [ "${{ github.event.inputs.mode }}" = "all" ]; then
            QS="all=1"
          elif [ "${{ github.event.inputs.mode }}" = "carousel" ] || [ "$slot" = "5" ]; then
            QS="carousel=1"
          else
            QS="slot=$slot"
          fi
          echo "UTC hour $H → $QS"
          ok=0
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -m 300 \
              -X POST "https://landingprep.com/api/ig/post-daily?$QS" \
              -H "x-ig-secret: ${{ secrets.IG_POST_SECRET }}")
            echo "Attempt $attempt — HTTP $code"; cat /tmp/resp.json || true; echo
            if [ "$code" = "200" ]; then ok=1; break; fi
            # Fail fast on Instagram auth/permission/abuse blocks — retrying won't help and can deepen the block.
            # Only genuine transient failures (cold start, gateway, timeout, empty body) fall through to a retry.
            if grep -qiE 'OAuthException|API access blocked|access token|"code":(190|200|10|803|368)|permission' /tmp/resp.json 2>/dev/null; then
              echo "::error::Instagram blocked the request (auth/permission, not transient). Not retrying — fix the token/app in Meta, then re-run."
              exit 1
            fi
            sleep 25
          done
          [ "$ok" = "1" ] || { echo "::error::Instagram post failed after retries"; exit 1; }
