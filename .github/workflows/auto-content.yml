name: Auto Content & Indexing

# Marketing automation: keeps search engines fresh on our content.
#  - Pings IndexNow (Bing / Yandex / Naver / Seznam) so new & updated pages get
#    crawled within minutes instead of days. Google reads the same pages via
#    sitemap.xml in Search Console.
#  - Runs weekly, and on demand from the Actions tab, and automatically whenever
#    blog content or the sitemap changes on main.
#
# No secrets required — IndexNow ownership is proven by the public key file
# committed at the repo root (237c16b197efafd6888221c446b5f68e.txt), which is
# served live at https://landingprep.com/<key>.txt after deploy.

on:
  schedule:
    - cron: "30 6 * * 1" # every Monday 06:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "blog-data.jsx"
      - "sitemap.xml"
      - "seo-pages.js"

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Submit URLs to IndexNow
        run: node scripts/indexnow-submit.mjs

      # Google does not support IndexNow, but re-fetching the sitemap via the
      # Search Console API is the equivalent nudge. Requires GSC_API_KEY secret
      # (any Google API key with Search Console API scope, set in repo Settings →
      # Secrets). If the secret is absent the step is silently skipped — no failure.
      - name: Ping Google Search Console sitemap
        env:
          GSC_API_KEY: ${{ secrets.GSC_API_KEY }}
        run: |
          if [ -z "$GSC_API_KEY" ]; then
            echo "GSC_API_KEY not set — skipping Google sitemap ping."
            exit 0
          fi
          curl -fsS -X POST \
            "https://www.googleapis.com/webmasters/v3/sites/https%3A%2F%2Flandingprep.com%2F/sitemaps/https%3A%2F%2Flandingprep.com%2Fsitemap.xml?key=${GSC_API_KEY}" \
            -H "Content-Length: 0" \
            && echo "Google sitemap ping sent." \
            || echo "Google sitemap ping failed (non-fatal)."
